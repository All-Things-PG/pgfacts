dcms:
  title: DCMS
  description: Dynamic Content and Menuing System
  summary: >-
    Welcome to DCMS - Dynamic Content and Menuing System. DCMS is central to the design of
    Phase 2 of the All Things PG website and provides the structure for curating content and
    menu-driven navigation.
  pages:
    - title: What is DCMS?
      description: Overview of the Dynamic Content and Menuing System.
      url: /dcms/what-is-dcms/
    - title: Dynamic Content
      description: How content is organized and rendered dynamically.
      url: /dcms/dynamic-content/
    - title: Dynamic Menus
      description: Menu behavior and topic navigation.
      url: /dcms/dynamic-menus/
    - title: Curating Content
      description: How content is grouped and presented.
      url: /dcms/curating-content/
    - title: Managing Tiles
      description: How portal tiles are selected and displayed.
      url: /dcms/managing-tiles/
  tiles:
    - title: Dynamic Content
      description: Content driven by the topic model and page registry.
      url: /dcms/dynamic-content/
    - title: Dynamic Menus
      description: The menu experience that routes to each topic page.
      url: /dcms/dynamic-menus/
    - title: Curating Content
      description: The structure for organizing content by topic.
      url: /dcms/curating-content/
