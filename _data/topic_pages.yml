home:
  title: Welcome
  description: Explore the Phase 2 documentation
  summary: >-
    Welcome to the Phase 2 documentation for All Things PG. Use the topic menus to explore the design, the data model, and the user experiences for this documentation site that will carry over to Phase 2 of the website.
  pages:
    - title: Home
      description: Landing page for the Phase 2 documentation.
      url: /home/
    - title: Executive Summary
      description: Overview of the updated Phase 2 website outlining the direction and goals.
      url: /docs/executive-summary.html
    - title: Explore Documentation
      description: Documentation index for the documentation site.
      url: /docs/
  tiles:
    - title: DCMS
      description: Description of DCMS (Dynamic Content and Menuing System).
      url: /dcms/
    - title: User Experience
      description: Describes the portal experiences.  A 'Portal' is a view of the website customized for a particular type of user.
      url: /user-experience/
    - title: Database
      description: Describe the data model and diagrams of the database supporting the ATPG website.
      url: /database/
dcms:
  title: DCMS
  description: Dynamic Content and Menuing System
  summary: >-
    Welcome to DCMS - Dynamic Content and Menuing System. DCMS is a CMS design that supports data-driven menus and content, which is central to the ATPG website.  
  pages:
    - title: What is DCMS?
      description: Overview of the Dynamic Content and Menuing System.
      url: /dcms/what-is-dcms/
    - title: Dynamic Content
      description: How content is curated, organized and rendered dynamically.
      url: /dcms/dynamic-content/
    - title: Dynamic Menus
      description: How menus are dynamically defined and linked to curated content.
      url: /dcms/dynamic-menus/
    - title: Curating Content
      description: Describes the workflow for authors to edit or create new content for the website.
      url: /dcms/curating-content/
    - title: Managing Tiles
      description: Reusable topic tile bars provide a compact set of related page links.
      url: /technical/managing-tiles.html
  tiles:
    - title: Dynamic Content
      description: Content driven by the topic model and page registry.
      url: /dcms/dynamic-content/
    - title: Dynamic Menus
      description: The menu experience that routes to each topic page.
      url: /dcms/dynamic-menus/
    - title: Curating Content
      description: The structure for organizing content by topic.
      url: /dcms/curating-content/
