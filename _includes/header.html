<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <img class="site-brand__logo" src="{{ '/assets/images/pg-logo.png' | relative_url }}" alt="PG Facts" />
      <span class="site-brand__title">PG Facts</span>
    </a>
    <div class="site-brand__tagline">Public documentation for Phase 2 of All Things PG</div>
  </div>
  <nav class="site-nav" aria-label="Topics">
    <a class="site-nav__link site-nav__link--home" href="{{ '/' | relative_url }}">Home</a>
    {% for topic in site.data.topics | sort: "order" %}
      <a class="site-nav__link" href="{{ topic.folder | relative_url }}">{{ topic.title }}</a>
    {% endfor %}
  </nav>
</header>
