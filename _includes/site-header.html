<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/home/' | relative_url }}" aria-label="All Things PG home">
      <img class="site-brand__logo" src="{{ '/assets/images/pg-logo.png' | relative_url }}" alt="All Things PG">
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        <a class="site-nav__link" href="{{ item.url | relative_url }}">{{ item.label }}</a>
      {% endfor %}
      <a class="site-nav__contact" href="mailto:dave@allthingspg.org?subject=PG%20Facts%20feedback&amp;body=Thank%20you%20for%20your%20feedback.%20Please%20tell%20us%20how%20we%20can%20improve%20this%20site%20or%20its%20documentation.%0D%0A%0D%0A">Contact Us</a>
    </nav>
  </div>
</header>
