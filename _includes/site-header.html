<header class="oldsite-header">
  <div class="oldsite-header-inner">
    <a class="pg-logo-link" href="{{ '/' | relative_url }}">
      <img class="pg-logo" src="{{ '/assets/images/pg-logo.png' | relative_url }}" alt="All Things PG">
    </a>
    <nav class="oldsite-navigation" aria-label="Main navigation">
      <ul class="pg-nav-links">
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        {% for item in site.data.navigation %}
          <li>
            <a{% if item.children %} class="has-children"{% endif %} href="{{ item.url | relative_url }}">{{ item.label }}</a>
            {% if item.children %}
              <ul class="pg-submenu">
                {% for child in item.children %}
                  <li><a href="{{ child.url | relative_url }}">{{ child.label }}</a></li>
                {% endfor %}
              </ul>
            {% endif %}
          </li>
        {% endfor %}
      </ul>
    </nav>
    <a class="oldsite-donate-button" href="mailto:dave@allthingspg.org?subject=PG%20Facts%20feedback&amp;body=Thank%20you%20for%20your%20feedback.%20Please%20tell%20us%20how%20we%20can%20improve%20this%20site%20or%20its%20documentation.%0D%0A%0D%0A">Contact Us</a>
  </div>
</header>
