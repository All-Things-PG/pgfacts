    <text x="149.5" y="232" text-anchor="middle" font-size="13" fill="#485965">Content in the database</text>

    <rect x="322" y="50" width="255" height="210" rx="14" fill="#fff" stroke="#e07822" stroke-width="2" />
    <text x="449.5" y="88" text-anchor="middle" font-size="15" font-weight="700" letter-spacing=".4">DYNAMIC MENU ITEM</text>
    <rect x="354" y="108" width="191" height="58" rx="8" fill="#fbf4e8" stroke="#d8c7ad" />
