    <rect x="622" y="50" width="255" height="210" rx="14" fill="#fff" stroke="#e07822" stroke-width="2" />
    <text x="749.5" y="88" text-anchor="middle" font-size="16" font-weight="700" letter-spacing=".7">BUILD MENU</text>
    <rect x="654" y="108" width="191" height="94" rx="8" fill="#fff" stroke="#d8c7ad" />
