    <text x="299.5" y="23" text-anchor="middle">DATABASE</text>
    <path d="M34 37h531m-531 0v8m531-8v8" fill="none" stroke="#52758b" stroke-width="2" />
    <text x="899.5" y="23" text-anchor="middle">WEBSITE</text>
    <path d="M634 37h531m-531 0v8m531-8v8" fill="none" stroke="#52758b" stroke-width="2" />
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263746">
