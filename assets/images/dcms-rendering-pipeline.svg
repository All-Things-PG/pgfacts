<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Conceptual ASP.NET Core content rendering flow</title>
<desc id="desc">A menu item identifies a content document. ASP.NET Core loads the document and its elements, selects a page based on ContentType, renders supported elements with content cards, and returns composed HTML to the browser.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#52758b" /></marker></defs>
<rect width="1200" height="320" rx="18" fill="#f1f1f1" />
<g font-family="Arial, Helvetica, sans-serif" fill="#52758b" font-size="12" font-weight="700" letter-spacing="1"><text x="120" y="22" text-anchor="middle">MENU</text><text x="600" y="22" text-anchor="middle">ASP.NET CORE</text><text x="1080" y="22" text-anchor="middle">BROWSER</text></g>
<g font-family="Arial, Helvetica, sans-serif" fill="#263746">
<rect x="20" y="45" width="200" height="210" rx="14" fill="#fff" stroke="#e07822" stroke-width="2"/><text x="120" y="78" text-anchor="middle" font-size="15" font-weight="700">MENU ITEM</text><rect x="40" y="96" width="160" height="83" rx="8" fill="#fbf4e8" stroke="#d8c7ad"/><text x="120" y="128" text-anchor="middle" font-size="15" font-weight="600">Diagnosis</text><text x="120" y="153" text-anchor="middle" font-size="12">ContentDocumentID</text><text x="120" y="222" text-anchor="middle" font-size="13" fill="#485965">Selected by the visitor</text>
<rect x="260" y="45" width="200" height="210" rx="14" fill="#fff" stroke="#e07822" stroke-width="2"/><text x="360" y="78" text-anchor="middle" font-size="15" font-weight="700">LOAD DATA</text><rect x="280" y="96" width="160" height="83" rx="8" fill="#fff" stroke="#d8c7ad"/><rect x="294" y="108" width="132" height="24" rx="4" fill="#fbf4e8"/><text x="360" y="125" text-anchor="middle" font-size="12" font-weight="600">ContentDocument</text><rect x="294" y="140" width="132" height="26" rx="4" fill="#e7f2f7"/><text x="360" y="157" text-anchor="middle" font-size="12">ContentElements</text><text x="360" y="222" text-anchor="middle" font-size="13" fill="#485965">Read document and elements</text>
<rect x="500" y="45" width="200" height="210" rx="14" fill="#fff" stroke="#e07822" stroke-width="2"/><text x="600" y="78" text-anchor="middle" font-size="15" font-weight="700">SELECT PAGE</text><rect x="520" y="96" width="160" height="83" rx="8" fill="#e7f2f7" stroke="#9ab9c9"/><text x="600" y="126" text-anchor="middle" font-size="14" font-weight="600">ContentType</text><path d="M545 140h110" stroke="#52758b" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="163" text-anchor="middle" font-size="13">Article page</text><text x="600" y="222" text-anchor="middle" font-size="13" fill="#485965">Chooses page composition</text>
<rect x="740" y="45" width="200" height="210" rx="14" fill="#fff" stroke="#e07822" stroke-width="2"/><text x="840" y="78" text-anchor="middle" font-size="15" font-weight="700">RENDER ELEMENTS</text><rect x="758" y="96" width="164" height="83" rx="8" fill="#fbf4e8" stroke="#d8c7ad"/><text x="840" y="118" text-anchor="middle" font-size="12" font-weight="600">FormatType + MimeType</text><text x="840" y="141" text-anchor="middle" font-size="12">Choose a card renderer</text><text x="840" y="164" text-anchor="middle" font-size="12">BlockInfo · layout hints</text><text x="840" y="222" text-anchor="middle" font-size="13" fill="#485965">Cards render supported data</text>
<rect x="980" y="45" width="200" height="210" rx="14" fill="#fff" stroke="#e07822" stroke-width="2"/><text x="1080" y="78" text-anchor="middle" font-size="15" font-weight="700">HTML PAGE</text><rect x="1001" y="94" width="158" height="96" rx="7" fill="#fff" stroke="#d8c7ad"/><rect x="1012" y="104" width="136" height="23" rx="4" fill="#fbf4e8"/><text x="1080" y="120" text-anchor="middle" font-size="11" font-weight="600">Text card</text><rect x="1012" y="132" width="136" height="25" rx="4" fill="#e7f2f7"/><text x="1080" y="149" text-anchor="middle" font-size="11" font-weight="600">Image card</text><rect x="1012" y="162" width="136" height="20" rx="4" fill="#fbf4e8"/><text x="1080" y="176" text-anchor="middle" font-size="11" font-weight="600">Text card</text><text x="1080" y="222" text-anchor="middle" font-size="13" fill="#485965">Browser receives composed page</text>
</g>
<path d="M228 150h24M468 150h24M708 150h24M948 150h24" fill="none" stroke="#52758b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#485965">One document may contain many elements; each supported element can become its own content card.</text>
</svg>
