  <path d="M283 192h34" fill="none" stroke="#52758b" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M859 192h34" fill="none" stroke="#52758b" stroke-width="3" marker-end="url(#arrow)" />
</svg>
