<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1060" viewBox="0 0 980 1060" role="img" aria-labelledby="title desc">
<title id="title">Two states of the All Things PG mobile experience</title>
<desc id="desc">Two smartphone mockups using the actual All Things PG logo. First, the home screen shows the visitor experience selector set to Patient. Second, the same screen still shows that selector while an open navigation drawer covers the page from the left. About PG and Clinical Topics are expanded, exposing submenu choices such as Symptoms, Diagnosis, Treatment, Wound Care, Pain Management, and Outcomes. This is a proposed Phase 2 concept.</desc>
